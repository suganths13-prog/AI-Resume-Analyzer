{% extends "base.html" %}
{% block title %}Register | AI Resume Analyzer{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Create Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="/login/">Login</a></p>
</div>
{% endblock %}
